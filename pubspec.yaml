name: aadhaar_verifier
description: "Aadhaar / TN state document verification desk - CSC operator tool (Windows desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # File / image handling
  file_picker: ^8.1.2
  image: ^4.2.0
  path_provider: ^2.1.4
  path: ^1.9.0
  cross_file: ^0.3.4

  # QR code decoding from a static image file (scanner/upload/PDF page)
  flutter_zxing: ^2.0.0

  # PDF report generation + save/share
  pdf: ^3.11.1
  printing: ^5.13.3

  # PDF (uploaded certificate) -> page images, for multi-page support
  pdfx: ^2.6.0

  provider: ^6.1.2
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
