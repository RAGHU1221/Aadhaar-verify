name: Build Windows app

# Runs on GitHub's own Windows runner, which has a real Flutter SDK,
# real pub.dev access, and a real Visual Studio C++ toolchain - none of
# which were available in the sandbox this project was originally
# written in. This is the first time the code actually gets compiled.
#
# Trigger manually from the Actions tab (useful since you're often on
# mobile via the GitHub web UI), or automatically on every push.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # CMake 4.x removed support for very old cmake_minimum_required()
      # versions. The pdfx plugin's bundled pdfium download step
      # (flutter/ephemeral/.plugin_symlinks/pdfx/windows/DownloadProject.cmake)
      # still declares an old minimum, which fails to configure on the
      # CMake version bundled with the windows-latest runner/current
      # Visual Studio. This environment variable is CMake's own
      # documented escape hatch for exactly this transitional problem -
      # it tells every nested `cmake` invocation (including the one
      # DownloadProject triggers for pdfium) to treat old
      # cmake_minimum_required() versions as if they'd requested 3.5,
      # without needing to patch pdfx's vendored CMake files ourselves.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Scaffold + patch windows/ runner project
        shell: pwsh
        run: ./scripts/patch_windows_project.ps1

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (informational - won't fail the build)
        run: flutter analyze || echo "flutter analyze reported issues - see log above, build continues"
        continue-on-error: true

      - name: flutter build windows (release)
        run: flutter build windows --release

      - name: Upload built app as an artifact (portable/zip)
        uses: actions/upload-artifact@v4
        with:
          name: AadhaarDocVerifier-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Build installer (Inno Setup)
        # ISCC.exe ships preinstalled on GitHub's windows-latest runners
        # (see actions/runner-images software list) - no separate install
        # step needed.
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at the expected path - Inno Setup may have moved/changed on this runner image" }
          & $iscc "windows\installer\aadhaar_verifier.iss"

      - name: Upload installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: AadhaarDocVerifier-Setup
          path: build/installer/AadhaarVerifier-Setup.exe
          if-no-files-found: error
